[platformio]
workspace_dir = /Users/hwaipy/Documents/PlatformIO/ESP32Framework/base
build_dir = /Users/hwaipy/Documents/PlatformIO/ESP32Framework/base/build
libdeps_dir = /Users/hwaipy/Documents/PlatformIO/ESP32Framework/base/libdeps
cache_dir = /Users/hwaipy/Documents/PlatformIO/ESP32Framework/cache
default_envs =
    esp32-s3-supermini
    esp32-s3-n16r8
    esp32-c3-supermini
    esp32-c6-supermini

[env]
; Pinned pioarduino release provides one Arduino 3.3.11 toolchain for S3, C3
; and C6. Official PlatformIO espressif32 6.x cannot build Arduino for C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.3

; All three Super Mini boards use 4 MB flash. The default OTA partition table
; supplies two application slots and an OTA data partition.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-supermini]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

[env:esp32-s3-n16r8]
board = esp32-s3-devkitc1-n16r8
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DHWAIPY_DEVICE_MODEL=\"esp32-s3-n16r8\"

[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio

[env:esp32-c6-supermini]
board = esp32-c6-devkitm-1
board_build.flash_mode = dio
